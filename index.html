<!doctype html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Geolocation Timeline</title><link href="main.css" rel="stylesheet"></head><body><div class="app"><div class="timeline" id="timeline"></div><div class="input-area"><input id="messageInput" class="message-input" placeholder="Введите сообщение и нажмите Enter..."/></div></div><div class="modal-overlay" id="modalOverlay"><div class="modal"><h3 class="modal-title">Что-то пошло не так</h3><p class="modal-text">К сожалению, нам не удалось определить ваше местоположение, пожалуйста, дайте разрешение на использование геолокации, либо введите координаты вручную.</p><label class="modal-label">Широта и долгота через запятую</label> <input id="coordInput" class="coord-input" placeholder="51.50851, -0.12572"/><div class="modal-error" id="modalError"></div><div class="modal-actions"><button class="btn-cancel" id="modalCancel">Отмена</button> <button class="btn-ok" id="modalOk">OK</button></div></div></div><script src="main.js"></script></body></html>
